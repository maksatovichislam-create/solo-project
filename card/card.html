<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./card.css">
</head>
<body>
    <div class="product-detail">
    <img id="img" alt="Фото товара">
    <h1 id="title"></h1>
    <p id="article"></p>
    <p id="price"></p>
    <p id="stock"></p>

    <div class="options">
      <h3>Цвета:</h3>
      <p id="colors"></p>

      <h3>Память:</h3>
      <p id="memory"></p>

      <h3>Модель:</h3>
      <p id="model"></p>
    </div>

    <button class="buy-btn">Купить</button>
    <p class="note">Цена указана при единовременной оплате. Рассрочка или кредит могут изменить итоговую сумму.</p>
  </div>

  <script src="card.js"></script>
</body>
</html>
